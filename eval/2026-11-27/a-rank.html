const fromB64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryOpen() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt: fromB64(SALT), iterations: ITER, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: fromB64(IV)}, key, fromB64(DATA));
    document.body.innerHTML = new TextDecoder().decode(plain);
    document.body.style.display = 'block';
  } catch (e) {
    err.textContent = 'パスワードが違います';
  }
}
document.getElementById('open').addEventListener('click', tryOpen);
document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryOpen(); });
</script>
